# VoiceCall use case for Nothing Phone (1)
# Amplifier L = top speaker (also the earpiece), Amplifier R = bottom speaker

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value.TQ "Voice"
}

SectionDevice."Earpiece" {
	Comment "Earpiece Playback"

	EnableSequence [
		cset "name='Amplifier R Playback Switch' off"
		cset "name='Amplifier L Playback Switch' on"
	]

	DisableSequence [
		cset "name='Amplifier R Playback Switch' on"
	]

	Value {
		PlaybackChannels 1
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},5"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	EnableSequence [
		cset "name='Amplifier L Playback Switch' on"
		cset "name='Amplifier R Playback Switch' on"
	]

	Value {
		PlaybackChannels 1
		PlaybackPriority 250
		PlaybackPCM "hw:${CardId},5"
	}
}

SectionDevice."Mic1" {
	Comment "Bottom Microphone"

	Include.wcdmice.File "/codecs/wcd938x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/AnalogMic1DisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	EnableSequence [
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC1 Volume' 20"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},5"
	}
}
